name: Validate Submissions

on:
  pull_request:
    paths:
      - 'THE WORKSHOPS/platform/submissions/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate changed submissions
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            -- 'THE WORKSHOPS/platform/submissions/*.yaml' > /tmp/changed_files.txt
          if [ ! -s /tmp/changed_files.txt ]; then
            echo "No submission files changed."
            exit 0
          fi
          failed=0
          while IFS= read -r f; do
            echo "--- Validating: $f"
            python "THE WORKSHOPS/platform/validator/validator.py" "$f" || failed=1
          done < /tmp/changed_files.txt
          exit $failed
