candidate:
  proposed_ref: ART-0008
  claim: >
    Betriebsobjekt-Sein ist keine feste Eigenschaft eines Objekts,
    sondern eine Eigenschaft des Objekts relativ zum aktuellen
    Wissensstand. Dasselbe Objekt kann die Verlustprobe heute bestehen
    und morgen nicht, wenn ein materialisiertes Urteil entsteht, das
    es als tragende Aussage nutzt.
  basis: >
    Die Verlustprobe prueft, ob die Loesch eines Objekts ein bereits
    materialisiertes Urteil ungueltig macht. Diese Pruefung ist
    zustandsabhaengig: sie bezieht sich auf den aktuellen Wissensstand,
    nicht auf eine zeitlose Eigenschaft des Objekts. Die
    Verlustprobe fuer SESSION.md (2026-07-25) ergab: besteht im
    aktuellen Wissensstand, weil kein materialisiertes Urteil SESSION.md
    als tragende Aussage nutzt. Derselbe Test koennte nach
    Materialisierung eines solchen Urteils scheitern. Die Eigenschaft
    Betriebsobjekt ist damit nicht objektfest, sondern relational.
  counter: >
    GV1 - Koennte man Betriebsobjekt als feste Eigenschaft definieren,
    indem man die moegliche zukuenftige Nutzung ausschliesst?
    Scheitert: die Verlustprobe prueft tatsaechlichen Wissensstand,
    nicht hypothetische Zustaende. Eine Definition, die zukuenftige
    Urteile ausschliesst, waere eine andere Probe, nicht die
    Verlustprobe.
    GV2 - Ist die Zustandsabhaengigkeit ein Problem der Probe oder
    ein echtes Merkmal der Ontologie? Offen: moeglicherweise sind
    Betriebsobjekte tatsaechlich relational und nicht objektfest.
    Das waere eine staerkere Aussage als K1 selbst.
  open: >
    GV2 ist nicht aufgeloest: ob Betriebsobjekt-Sein fundamental
    relational ist oder ob die Verlustprobe nur ein unzureichendes
    Kriterium ist, bleibt offen. K1 behauptet nur die Zustandsabhaengigkeit,
    nicht die fundamentale Relationalitaet.
